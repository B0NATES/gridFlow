<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GridFlow</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">
  
</head>

<body>
  <!-- Painel superior -->
  <nav class="navbar navbar-dark shadow-sm" id="panel-heading-heading">
    <div class="container-fluid d-flex justify-content-between align-items-center">
      <div class="d-flex align-items-center gap-2">
        <button id="btn-menu" class="btn-hamburguer d-lg-none">☰</button>
        <a id="link-heading" class="navbar-brand d-flex align-items-center gap-2" href="#">
          <img class="img-heading" src="./img/android-chrome-512x512.png" alt="Logo">
          <span class="txt-gridFlow">GRID FLOW</span>
        </a>
      </div>
      <div class="text-light small fw-semibold me-2">Bem-vindo, <span id="usuario-nome">admin</span></div>
    </div>
  </nav>

  <!-- Layout principal -->
  <div class="d-flex flex-nowrap layout-principal">
    <!-- Painel lateral esquerdo -->
    <aside class="panel-nav-lateral-esquerdo" id="menu-lateral">
      <ul class="list-unstyled mt-3">
        <li><span class="icon">🏠</span><span class="label"></span></li>
        <li><span class="icon">⚙️</span><span class="label"></span></li>
        <li><a href="./relatorios.html" class="text-decoration-none text-light"><span class="icon">📊</span><span class="label">Relatórios</span></a></li>
        <li><span class="icon">📅</span><span class="label"></span></li>
      </ul>
    </aside>

    <!-- Conteúdo central -->
    <main class="flex-fill conteudo-central">
      <section class="container-fluid h-100 d-flex flex-column justify-content-start py-4">
        <div class="text-center mb-4">
          <div class="heading-dashboard">
            <div class="heading-content">
              <h1>GRID FLOW</h1>
              <p>Gerencie, visualize e controle seu fluxo de forma inteligente.</p>
            </div>
          </div>
          
        </div>

        <!-- Saldo mobile -->
        <div class="card card-saldo-mobile shadow-sm mb-4">
          <div class="card-body text-center">
            <h5 class="card-title">Saldo Atual</h5>
            <p id="saldoMobile" class="card-text fw-bold fs-5">R$ 00,00</p>
          </div>
        </div>

        <!-- Botões de ação -->
        <div class="mb-4 d-flex justify-content-center gap-3 flex-wrap">
          <button id="bnt-adicionar-fila" class="btn btn-primary btn-acao">➕ Novo Registro</button>
          <button class="btn btn-success btn-acao">🔎 Buscar</button>
        </div>

        <!-- Container dos cards -->
        <div class="card card-tabela shadow-lg border-0">
          <div class="card-body">
            <h5 class="mb-3 fw-bold text-center text-primary">Últimos Registros</h5>
            <div id="cards-container" class="d-flex flex-wrap justify-content-center gap-3">
              <!-- Os cards dos registros serão inseridos dinamicamente pelo script.js -->
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- Painel lateral direito -->
    <aside class="cards-laterais-direitos">
      <div class="card card-info shadow-sm mb-3 text-center">
        <div class="card-body">
          <h5 class="card-title">Saldo</h5>
          <p id="pSaldo" class="card-text fw-bold fs-5">R$ 00,00</p>
        </div>
      </div>

      <div class="card card-info shadow-sm text-center">
        <div class="card-body">
          <h5 class="card-title">🔔 Notificações</h5>
          <p class="card-text small">Nenhuma notificação no momento.</p>
        </div>
      </div>
    </aside>
  </div>

  <!-- Modal -->
  <div class="modal-adicionar" id="modal-adicionar">
    <div class="content">
      <div class="fechar">
        <button id="btn-fechar-modal" aria-label="Fechar">
          <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 6 6 18" />
            <path d="m6 6 12 12" />
          </svg>
        </button>
      </div>

      <div class="row">
        <div class="col-md-4">
          <label for="data">Data</label>
          <input type="text" id="data" readonly>
        </div>
        <div class="col-md-4">
          <label for="placa">Placa</label>
          <input type="text" id="placa" placeholder="ABC-1234">
        </div>
        <div class="col-md-4">
          <label for="kwh">kWh</label>
          <input type="text" id="kwh" placeholder="Ex: 45.8">
        </div>
      </div>

      <div class="row">
        <div class="col-md-4">
          <label for="refrigerante">Refrigerante</label>
          <select id="relf">
            <option value="">--selecione---</option>
            <option value="Sim">SIM</option>
            <option value="Não">NÃO</option>
          </select>
        </div>
        <div class="col-md-2" style="display: none;" id="txt_valorRefrigerante">
          <label for="txt_consumo">Consumo</label>
          <input type="text" id="txt_consumo" placeholder="EX: 50">
        </div>
        <div class="col-md-2">
          <label for="valor">Valor</label>
          <input type="text" id="valor" readonly>
        </div>
        <div class="col-md-4">
          <label for="formaPagamento">Forma de Pagamento</label>
          <select id="formaPagamento">
            <option value="">--selecione---</option>
            <option value="dinheiro">Dinheiro</option>
            <option value="cartao">Cartão</option>
            <option value="pix">Pix</option>
          </select>
        </div>
      </div>

      <div class="botoes">
        <button type="button" class="btn btn-cancelar" id="btn-cancelar">🗑 Limpar</button>
        <button id="enviar" type="submit" class="btn btn-confirmar">🚀 Enviar</button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script type="module" src="./scripts/script.js"></script>
  <script type="module" src="./scripts/index.js"></script>

  <!-- Sincronizador de saldo mobile -->
  <script>
    const syncSaldoMobile = () => {
      const saldoDesktop = document.getElementById("pSaldo");
      const saldoMobile = document.getElementById("saldoMobile");
      if (saldoDesktop && saldoMobile) {
        saldoMobile.textContent = saldoDesktop.textContent;
      }
    };
    setInterval(syncSaldoMobile, 1000);

    
  window.addEventListener('scroll', () => {
    const nav = document.getElementById('panel-heading-heading');
    if (window.scrollY > 10) {
      nav.classList.add('scrolled');
    } else {
      nav.classList.remove('scrolled');
    }
  });


  </script>

<script type="module" src="./scripts/authCheck.js"></script>
</body>
</html>
