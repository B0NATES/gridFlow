
<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@300;500;700&display=swap"
    rel="stylesheet">
  <title>GridFlow</title>
</head>

<body>
  <!-- Painel superior -->
<div id="panel-heading-heading">
  <nav class="navbar navbar-dark">
    <div class="container-fluid">
      <!-- Botão hamburguer -->
      <button id="btn-menu" class="btn-hamburguer d-lg-none">
        ☰
      </button>

      <a id="link-heading" class="navbar-brand d-flex align-items-center" href="#">
        <img class="img-heading me-2" src="./img/android-chrome-512x512.png" alt="Logo" width="150" height="150">
        <span class="fs-3 txt-gridFlow">GRID FLOW</span>
      </a>
    </div>
  </nav>
</div>

<!-- Layout principal -->
<div class="d-flex" style="height: calc(100vh - 70px);">

  <!-- Painel lateral esquerdo -->
  <aside class="panel-nav-lateral-esquerdo" id="menu-lateral">
    <ul class="list-unstyled">
      <li><span class="icon">🏠</span><span class="label">Início</span></li>
      <li><span class="icon">⚙️</span><span class="label">Painel de Controle</span></li>
      <li>
        <a href="./relatorios.html" class="text-decoration-none text-light">
          <span class="icon">📊</span><span class="label">Relatórios</span>
        </a>
      </li>
      <li><span class="icon">📅</span><span class="label">Agenda</span></li>
    </ul>
  </aside>



    <!-- Conteúdo central -->
    <main class="flex-fill p-4 conteudo-central">
      <h2 class="fw-bold mb-3">GRID FLOW</h2>
      <p>Bem-vindo <strong>login</strong>!</p>

      <div class="mt-4">
        <button id='bnt-adicionar-fila' class="btn btn-primary me-2">➕</button>
        <button class="btn btn-success">🔎</button>
      </div>
<br>
      <div class="text-center">
        <table id="table" class="table table-hover">
          <thead>
            <tr>
              <th>Data</th>
              <th>Placa</th>
              <th>Kwh</th>
              <th>Refrigerante</th>
              <th>Valor</th>
              <th>Forma de Pagamento</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
        
      </div>
    </main>

    <!-- Painel lateral direito -->
    <aside class="cards-laterais-direitos">
      <div class="card mb-3 shadow-sm">
        <div class="card-body">
          <h5 class="card-title">Saldo</h5>
          <p id="pSaldo" class="card-text">R$ 00,00</p>
        </div>
      </div>

      <div class="card shadow-sm">
        <div class="card-body">
          <h5 class="card-title">🔔 </h5>
          <p class="card-text">Notificações recentes ou alertas.</p>
        </div>
      </div>
    </aside>
  </div>



  <!-- MODAL -->
  <div class="modal-adicionar" id="modal-adicionar">
    <div class="content">
      <div class="fechar">
        <button id="btn-fechar-modal" aria-label="Fechar">
          <!-- Ícone SVG X -->
          <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="none"
            stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 6 6 18" />
            <path d="m6 6 12 12" />
          </svg>
        </button>
      </div>

      <div class="row">
        <div class="col-md-4">
          <label for="data">Data</label>
          <input type="text" id="data" placeholder="00/00/0000" readonly>
        </div>
        <div class="col-md-4">
          <label for="placa">Placa</label>
          <input type="text" id="placa" placeholder="ABC-1234">
        </div>
        <div class="col-md-4">
          <label for="kwh">kWh</label>
          <input type="text" id="kwh" placeholder="Ex: 45.8">
        </div>
      </div>

      <div class="row">
        <div class="col-md-4">
            <label for="refrigerante">Refrigerante</label>
            <select name="relf" id="relf">
                <option value="">--selecione---</option>
                <option value="Sim">SIM</option>
                <option value="Não">NÃO</option>
            </select>
            
          </div>
          <div class="col-md-2" style="display: none;" id="txt_valorRefrigerante">
            <label for="txt_valorRefrigerante">Consumo</label>
            <input type="text" id="txt_consumo" placeholder="EX: 50">
          </div>
        <div class="col-md-2">
          <label for="valor">Valor</label>
          <input type="text" id="valor" readonly>
        </div>
        <div class="col-md-4">
          <label for="formaPagamento">Forma de Pagamento</label>
          <select id="formaPagamento">
            <option value="">--selecione---</option>
            <option value="dinheiro">Dinheiro</option>
            <option value="cartao">Cartão</option>
            <option value="pix">Pix</option>
          </select>
        </div>
      </div>

      <div class="botoes">
        <button type="button" class="btn btn-cancelar" id="btn-cancelar">
          <!-- Ícone de lixeira -->
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6" />
            <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
            <path d="M10 11v6M14 11v6M9 3h6a1 1 0 0 1 1 1v1H8V4a1 1 0 0 1 1-1z" />
          </svg>
          Limpar
        </button>

        <button id="enviar" type="submit" class="btn btn-confirmar">
          <!-- Ícone foguete -->
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4.5 16.5L3 21l4.5-1.5L16.5 10.5 13.5 7.5 4.5 16.5z" />
            <path d="M12 2C17 2 21 6 21 11v3l-3 3-3-3H9l-3 3-3-3v-3c0-5 4-9 9-9z" />
          </svg>
          Enviar
        </button>
      </div>
    </div>
  </div>

    <!-- scripts existentes -->
    <script src="./scripts/script.js"></script>
    <script type="module" src="./api/apiService.js"></script>
  
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const btnMenu = document.getElementById("btn-menu");
        const menuLateral = document.getElementById("menu-lateral");
  
        if (btnMenu && menuLateral) {
          btnMenu.addEventListener("click", () => {
            menuLateral.classList.toggle("aberto");
            document.body.classList.toggle("menu-aberto");
          });
        }
      });
    </script>
  </body>
  </html>
  
</body>
</html>
