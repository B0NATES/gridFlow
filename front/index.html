<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GridFlow</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">
</head>

<body>
  <!-- Painel superior -->
  <nav class="navbar navbar-dark" id="panel-heading-heading">
    <div class="container-fluid">
      <button id="btn-menu" class="btn-hamburguer d-lg-none">☰</button>
      <a id="link-heading" class="navbar-brand d-flex align-items-center" href="#">
        <img class="img-heading me-2" src="./img/android-chrome-512x512.png" alt="Logo" width="150" height="150">
        <span class="fs-3 txt-gridFlow">GRID FLOW</span>
      </a>
    </div>
  </nav>

  <!-- Layout principal -->
  <div class="d-flex" style="height: calc(100vh - 70px);">
    <!-- Painel lateral esquerdo -->
    <aside class="panel-nav-lateral-esquerdo" id="menu-lateral">
      <ul class="list-unstyled">
        <li><span class="icon">🏠</span><span class="label">Início</span></li>
        <li><span class="icon">⚙️</span><span class="label">Painel de Controle</span></li>
        <li><a href="./relatorios.html" class="text-decoration-none text-light"><span class="icon">📊</span><span class="label">Relatórios</span></a></li>
        <li><span class="icon">📅</span><span class="label">Agenda</span></li>
      </ul>
    </aside>

    <!-- Conteúdo central -->
    <main class="flex-fill p-4 conteudo-central">
      <h2 class="fw-bold mb-3">GRID FLOW</h2>
      <p>Bem-vindo <strong>login</strong>!</p>

      <div class="mt-4 mb-3 d-flex gap-2">
        <button id="bnt-adicionar-fila" class="btn btn-primary">➕</button>
        <button class="btn btn-success">🔎</button>
      </div>

      <!-- 📊 TABELA RESPONSIVA -->
      <div class="text-center table-container">
        <div class="table-responsive">
          <table id="table" class="table table-hover align-middle mb-0">
            <thead class="table-dark">
              <tr>
                <th>Data</th>
                <th>Placa</th>
                <th>Kwh</th>
                <th>Refrigerante</th>
                <th>Valor</th>
                <th>Forma de Pagamento</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </main>

    <!-- Painel lateral direito -->
    <aside class="cards-laterais-direitos">
      <div class="card mb-3 shadow-sm">
        <div class="card-body">
          <h5 class="card-title">Saldo</h5>
          <p id="pSaldo" class="card-text">R$ 00,00</p>
        </div>
      </div>

      <div class="card shadow-sm">
        <div class="card-body">
          <h5 class="card-title">🔔</h5>
          <p class="card-text">Notificações recentes ou alertas.</p>
        </div>
      </div>
    </aside>
  </div>

  <!-- MODAL -->
  <div class="modal-adicionar" id="modal-adicionar">
    <div class="content">
      <div class="fechar">
        <button id="btn-fechar-modal" aria-label="Fechar">
          <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 6 6 18" />
            <path d="m6 6 12 12" />
          </svg>
        </button>
      </div>

      <div class="row">
        <div class="col-md-4">
          <label for="data">Data</label>
          <input type="text" id="data" readonly>
        </div>
        <div class="col-md-4">
          <label for="placa">Placa</label>
          <input type="text" id="placa" placeholder="ABC-1234">
        </div>
        <div class="col-md-4">
          <label for="kwh">kWh</label>
          <input type="text" id="kwh" placeholder="Ex: 45.8">
        </div>
      </div>

      <div class="row">
        <div class="col-md-4">
          <label for="refrigerante">Refrigerante</label>
          <select id="relf">
            <option value="">--selecione---</option>
            <option value="Sim">SIM</option>
            <option value="Não">NÃO</option>
          </select>
        </div>
        <div class="col-md-2" style="display: none;" id="txt_valorRefrigerante">
          <label for="txt_consumo">Consumo</label>
          <input type="text" id="txt_consumo" placeholder="EX: 50">
        </div>
        <div class="col-md-2">
          <label for="valor">Valor</label>
          <input type="text" id="valor" readonly>
        </div>
        <div class="col-md-4">
          <label for="formaPagamento">Forma de Pagamento</label>
          <select id="formaPagamento">
            <option value="">--selecione---</option>
            <option value="dinheiro">Dinheiro</option>
            <option value="cartao">Cartão</option>
            <option value="pix">Pix</option>
          </select>
        </div>
      </div>

      <div class="botoes">
        <button type="button" class="btn btn-cancelar" id="btn-cancelar">🗑 Limpar</button>
        <button id="enviar" type="submit" class="btn btn-confirmar">🚀 Enviar</button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script type="module" src="./scripts/script.js"></script>
  <script type="module" src="./scripts/index.js"></script>
</body>
</html>
